#What locks a recipe for a player, on top of any hook a mod registers. A recipe is
#Locked if any listed source says so. Empty (the default) locks nothing.
#  recipeBook: Locked until the recipe is in the player's recipe book.
#  researchd:  Locked while Researchd blocks the recipe for the player's team.
#For example ["researchd"].
lockSources = []
#Whether vanilla's crafting recipes are Assembling recipes, from the pack built into the
#mod. Off, they stay at the crafting table and a pack ships its own Assembling recipes.
vanillaRecipes = true
#Whether other mods' shaped and shapeless crafting recipes become Assembling recipes at
#their own ids as recipes load (ADR-0011). Off, they stay at the crafting table.
modRecipes = true
#Mods' crafting recipes that modRecipes leaves at the crafting table: a namespace keeps
#all of a mod's, a recipe id just that one. For example ["create", "mekanism:jetpack"].
modRecipesExcluded = []

#The assembler_1 block.
[assembler_1]
	#Crafting speed: a craft takes the recipe's time divided by this, in ticks.
	# Default: 0.5
	# Range: 0.01 ~ 1000.0
	speed = 0.5
	#FE a tick while crafting. A craft costs this times the ticks it takes, spread over them;
	#a tick it can't be paid in full makes no progress, and an idle machine draws nothing.
	# Default: 37.5
	# Range: 0.0 ~ 1000000.0
	power = 37.5
	#FE the energy buffer holds.
	# Default: 50000
	# Range: > 1
	buffer = 50000
	#The categories of Assembling recipe this machine can hold: crafting, advanced-crafting, crafting-with-fluid.
	#Fill Recipe refuses a recipe whose category is not listed.
	categories = ["crafting", "advanced-crafting"]

