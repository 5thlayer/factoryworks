[small]
	#The side of the square the pole supplies, in blocks.
	# Default: 5
	# Range: 1 ~ 64
	supplySize = 5
	#How far a wire reaches from this pole, in blocks.
	# Default: 7.5
	# Range: 1.0 ~ 64.0
	wireReach = 7.5

[medium]
	#The side of the square the pole supplies, in blocks.
	# Default: 7
	# Range: 1 ~ 64
	supplySize = 7
	#How far a wire reaches from this pole, in blocks.
	# Default: 9.0
	# Range: 1.0 ~ 64.0
	wireReach = 9.0

[large]
	#The side of the square the pole supplies, in blocks.
	# Default: 18
	# Range: 1 ~ 64
	supplySize = 18
	#How far a wire reaches from this pole, in blocks.
	# Default: 18.0
	# Range: 1.0 ~ 64.0
	wireReach = 18.0

[solar_panel]
	#The power at full daylight, in watts. 60000 is 30 FE/t.
	# Default: 60000
	# Range: 0 ~ 1000000000
	peak_watts = 60000

[accumulator]
	#What the accumulator holds, in joules. 5000000 is 50000 FE.
	# Default: 5000000
	# Range: 100 ~ 1000000000000
	capacity_joules = 5000000
	#The power it charges and discharges at, in watts. 300000 is 150 FE/t.
	# Default: 300000
	# Range: 2000 ~ 1000000000000
	max_watts = 300000

[transmission]
	#How far a wire reaches from a Transmission Pole, in blocks.
	# Default: 32.0
	# Range: 1.0 ~ 256.0
	wireReach = 32.0

[transformer]
	#How far a Transformer's wire reaches toward a Transmission Pole, in blocks.
	# Default: 32.0
	# Range: 1.0 ~ 256.0
	lineReach = 32.0
	#How far a Transformer's wire reaches toward a Distribution Pole, in blocks.
	# Default: 9.0
	# Range: 1.0 ~ 64.0
	districtReach = 9.0
