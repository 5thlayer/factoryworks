#Whether loaders of tiers 2 to 4, and feeders of every tier, need FE for each item they move. Off, every loader moves items as tier 1 does, and every feeder moves them for free.
loadersNeedPower = true
#How many joules of a loader's Factorio energy cost one FE pays for.
# Default: 100
# Range: 1 ~ 9223372036854775807
joulesPerFe = 100

#What a feeder pays in joules for each item it moves, by tier. A feeder pays only when loadersNeedPower is on, and then at every tier.
[feederJoulesPerItem]
	# Default: 13300
	# Range: 1 ~ 1000000000
	belt = 66900
	# Default: 13300
	# Range: 1 ~ 1000000000
	improved = 6650
	# Default: 16240
	# Range: 1 ~ 1000000000
	express = 8120
	# Default: 23200
	# Range: 1 ~ 1000000000
	turbo = 23200
