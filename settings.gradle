// The pack's first-party mod (ADR-0014). The pack itself is not a Gradle project;
// this build exists solely to produce `planetaryfactory_core`'s jar.
pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'planetaryfactory'

include 'planetaryfactory_core'
project(':planetaryfactory_core').projectDir = file('mod')

def localJars = new groovy.json.JsonSlurper().parse(file('data/pack/local-jars.json')).jars
gradle.ext.localJars = localJars
gradle.ext.siblingMods = [] as Set

// -PsiblingBuilds builds and runs against checkouts in place of the pinned jars in mods/, so a change
// crossing repos is tried before any of them is released (#466). A bare -PsiblingBuilds swaps every
// row; -PsiblingBuilds=beltworks,craftworks swaps those. A row's checkout comes with the checkouts of
// the jars it nests, each at -P<name>Dir, default ~/minecraft_mods/<name>.
def requested = providers.gradleProperty('siblingBuilds')
if (requested.present) {
    def byMod = localJars.collectEntries { [it.mod, it] }
    def names = requested.get().split(',')*.trim().findAll { it && it != 'true' }
    def unknown = names.findAll { !byMod.containsKey(it) }
    if (unknown) {
        throw new GradleException("-PsiblingBuilds: ${unknown.join(', ')} has no row in "
                + "data/pack/local-jars.json (rows: ${byMod.keySet().join(', ')})")
    }
    // A row with `"sibling": false` pins a binary no checkout reproduces (Researchd#20).
    def pinnedOnly = names.findAll { byMod[it].sibling == false }
    if (pinnedOnly) {
        throw new GradleException("-PsiblingBuilds: ${pinnedOnly.join(', ')} is pinned with \"sibling\": false "
                + "in data/pack/local-jars.json, so it has no checkout to build")
    }
    def selected = names ? names.collect { byMod[it] } : localJars.findAll { it.sibling != false }
    gradle.ext.siblingMods = selected*.mod as Set

    def includeCheckout = { String name ->
        def property = "${name}Dir"
        def path = providers.gradleProperty(property).getOrElse("~/minecraft_mods/${name}")
        def dir = new File(path.replaceFirst('^~', System.getProperty('user.home'))).canonicalFile
        if (!dir.isDirectory()) {
            throw new GradleException("-P${property}: ${dir} is not a directory")
        }
        def properties = new File(dir, 'gradle.properties')
        if (!properties.isFile()) {
            throw new GradleException("-P${property}: ${dir} has no gradle.properties, so it is not a ${name} checkout")
        }
        def props = new Properties()
        properties.withInputStream { props.load(it) }
        def git = { String... args ->
            providers.exec {
                commandLine(['git', '-C', dir.path] + args.toList())
                ignoreExitValue = true
            }.standardOutput.asText.get().trim()
        }
        def dirty = git('status', '--porcelain') ? ' +uncommitted' : ''
        includeBuild dir
        println "siblingBuilds: not the pinned jar -- ${name} ${props.mod_version} at ${git('rev-parse', '--short', 'HEAD')}${dirty} (${dir})"
    }
    // A Library's own settings may include a checkout of what it nests too; the composite holds one
    // copy only while both inclusions name the same directory.
    selected.collectMany { [it.mod] + (it.nests ?: []) }.unique().each { includeCheckout(it) }
}
