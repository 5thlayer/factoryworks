plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
}

version = mod_version
group = maven_group
base.archivesName = mod_id

// Minecraft 26.1.2 and every 26.1 mod jar in `mods/` are compiled to class file version 69,
// which is Java 25. Building on 21 cannot read them.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neoforge_version

    // No `parchment` block: ParchmentMC has published no mappings for 26.1 (the newest data is
    // `parchment-1.21.9`). Restore it -- and the two `parchment_*` keys in `gradle.properties` --
    // the day a 26.1 release exists; until then naming one fails the build rather than
    // silently falling back.

    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        gameTestServer {
            type = 'gameTestServer'
            // Groundworks' and Beltworks' tests also register here, and some check cases the Pack's
            // settings rule out on purpose; each repo's own run holds them (#448). The pack's data
            // reaches it through KubeJS; see `linkKubeJS`.
            programArguments.addAll '--tests', 'factoryworks:*'
        }
    }

    mods {
        "$mod_id" {
            sourceSet sourceSets.main
        }
    }
}

// Read by `settings.gradle`, which includes the checkouts (ADR-0090).
def localJars = gradle.ext.localJars
def siblingMods = gradle.ext.siblingMods
def siblingBuilds = !siblingMods.isEmpty()

configurations {
    devRunMods
    runtimeClasspath.extendsFrom devRunMods
}

// Compile-time jars are taken from `mods/` rather than from a maven, so the build stays offline and
// always compiles against exactly the jars the pack ships -- except for a row under -PsiblingBuilds,
// whose jar is its checkout's.
def rowJars = localJars.collectEntries { row ->
    if (!(row.mod in siblingMods)) {
        return [row.mod, fileTree(dir: rootProject.file('mods'), include: row.pattern)]
    }
    // Asks for the jar rather than the classes directory, since `nestedRange` reads its jarjar metadata.
    def jar = configurations.create("sibling_${row.mod}") {
        canBeConsumed = false
        attributes {
            attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME))
            attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, Category.LIBRARY))
            attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE, objects.named(LibraryElements, LibraryElements.JAR))
        }
    }
    dependencies.add(jar.name, "${row.group}:${row.artifact}") { transitive = false }
    [row.mod, jar]
}

def jarjarEntries = { FileCollection jars ->
    jars.files.collectMany { jar ->
        def metadata = zipTree(jar).matching { include 'META-INF/jarjar/metadata.json' }.files
        metadata.collectMany { new groovy.json.JsonSlurper().parse(it).jars }
    }
}

// The version range a pinned jar nests `artifact` under, so `neoforge.mods.toml` requires what loads
// without the pack naming a version of it (ADR-0024). Read from the metadata, since a checkout's
// nested jar is named differently from a released one.
def nestedRange = { String artifact ->
    def rows = localJars.findAll { artifact in (it.nests ?: []) }
    def nested = rows.collectMany { jarjarEntries(rowJars[it.mod]) }.find { it.identifier.artifact == artifact }
    if (nested == null) {
        throw new GradleException("no jar of ${rows*.mod ?: 'any row'} nests ${artifact} -- "
                + (siblingBuilds ? 'check the checkout' : 'run scripts/sync-local-jars.py'))
    }
    nested.version.range
}
def nestedArtifacts = localJars.collectMany { it.nests ?: [] }.unique()
// A checkout of these is already on the classpath, so no pinned jar's copy joins it.
def siblingNests = localJars.findAll { it.mod in siblingMods }.collectMany { it.nests ?: [] } as Set

dependencies {
    // EMI is here for the recipe-viewer lock annotation (issue #75), and Jade for the
    // pole's live HUD line (#147). Both plugin classes are found by their own host's
    // annotation scan and referenced from nowhere else in the mod, so none of the jars is needed
    // at runtime for the rest of it to load.
    //
    // Jade's jar ships with a capital J, so the pattern carries both spellings rather than relying
    // on a case-insensitive filesystem to paper over it.
    //
    // FTB Teams, and the library its API names, for whose chart a Radar charts into (#368). Reached
    // only from `core/radar/ftb/`, which loads only when `ftbteams` does.
    //
    // FTB Chunks, pinned by name, because the map drawing calls its internal chunk task rather than
    // its API (ADR-0079): a bump must be a deliberate edit here, then a look at the map by hand.
    //
    // GeckoLib because the Steam Engine mixin (#282) extends Oritech's machine base class, which
    // implements GeckoLib's `GeoBlockEntity`; javac needs the supertype to resolve the hierarchy.
    compileOnly fileTree(
            dir: rootProject.file('mods'),
            include: ['oritech-*.jar', 'researchd-*.jar', 'emi-*.jar',
                      'Jade-*.jar', 'jade-*.jar', 'geckolib-neoforge-*.jar',
                      'ftb-teams-neoforge-*.jar', 'ftb-library-neoforge-*.jar',
                      'ftb-chunks-neoforge-26.1.2.8.jar'])
    // Each pinned jar, and the jars it nests rather than a copy of their own, so its pin stays the
    // only one (ADR-0024). On the dev runs too: the emitted recipes name their items.
    localJars.each { row ->
        if (row.mod in siblingMods) {
            compileOnly("${row.group}:${row.artifact}") { transitive = false }
            (row.nests ?: []).each { compileOnly("${row.group}:${it}") { transitive = false } }
            devRunMods("${row.group}:${row.artifact}") { transitive = false }
        } else {
            def jars = rowJars[row.mod]
            def nests = (row.nests ?: []) - siblingNests
            compileOnly jars
            compileOnly files({
                jars.files.collectMany { jar ->
                    def paths = jarjarEntries(files(jar)).findAll { it.identifier.artifact in nests }*.path
                    paths ? [zipTree(jar).matching { include paths }] : []
                }
            })
            devRunMods jars
        }
    }
    // Third-party jars on every dev run's classpath, the GameTest server included, because the
    // pack's data names their items and a server without them rejects those recipes at datapack
    // load (`scripts/check-datapack-load.py`). On `runtimeClasspath` only: `runtimeOnly` would put
    // `mods/` on `test`'s classpath, an input of a task `installToPack` writes into.
    //
    // Oritech (#277): the emitted assembling
    // recipes name its pipes, and a server without the jar rejects every one of
    // them, which would leave this check unable to tell a real id from a typo. Athena
    // and GeckoLib are what Oritech requires to load. FTB Filter System for the same reason: the
    // re-authored smart filter recipe makes its item (#442), with FTB Library, which it requires.
    //
    // KubeJS and Rhino because KubeJS is how the pack's data and registered items reach the game,
    // in the pack and in the harness alike (#338). Better Advanced Tooltips too: KubeJS declares it
    // an optional client dependency, yet registering its creative tab reads a BAT class on the
    // server as well, and mod loading fails without it.
    devRunMods fileTree(
            dir: rootProject.file('mods'),
            include: ['ftb-library-neoforge-*.jar',
                      'oritech-*.jar', 'athena-*.jar', 'geckolib-neoforge-*.jar',
                      'ftb-filter-system-neoforge-*.jar',
                      'kubejs-neoforge-*.jar', 'rhino-*.jar',
                      'better-advanced-tooltips-*.jar'])
    // DataFixerUpper, and only DataFixerUpper. `Codec` is Mojang's serialisation library rather
    // than a Minecraft type, so the Assembler's attachment codec can be round-tripped on a plain
    // JVM -- which is what ADR-0038's "round-trip the data attachment" asks for. Minecraft itself
    // stays off this classpath; the version is the one Minecraft 1.21.1 ships.
    testImplementation 'com.mojang:datafixerupper:8.0.16'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

repositories {
    mavenCentral()
}

// The test source set is deliberately absent from `neoForge.mods` above, so Minecraft is not on its
// classpath. That is the pack's testing policy, not an oversight: the row for "this pack logic
// computes something" asks for an ordinary unit test run without Minecraft, and a classpath that
// cannot see a `ResourceLocation` is what keeps the logic honest about staying testable.

tasks.named('test', Test).configure {
    useJUnitPlatform()
    testLogging { events 'failed' }
    systemProperty 'pf.repo', rootProject.projectDir.absolutePath
}

// KubeJS reads `<game dir>/kubejs` and nothing else -- the path is not configurable -- and a dev
// run's game dir is `mod/run/`. A link to the repo's own `kubejs/` makes the harness read the
// scripts and data the pack reads, from the one copy there is (#338). Created by the build rather
// than committed, because `mod/run/` is not tracked.
tasks.register('linkKubeJS') {
    description = 'Links the dev runs\' kubejs/ to the repo\'s, so they load the pack\'s own data.'
    def link = file('run/kubejs').toPath()
    def target = rootProject.file('kubejs').toPath()
    doLast {
        if (java.nio.file.Files.isSymbolicLink(link)) {
            java.nio.file.Files.delete(link)
        } else if (java.nio.file.Files.exists(link)) {
            throw new GradleException("${link} is a real directory, not a link to ${target}: " +
                    'a dev run would load it instead of the pack\'s data. Delete it.')
        }
        java.nio.file.Files.createDirectories(link.parent)
        java.nio.file.Files.createSymbolicLink(link, link.parent.relativize(target))
    }
}

// A dev run reads its server configs from `mod/run/config/`, so the harness would test the defaults
// rather than the pack's: loaders need power (#447) and machines lock by research (#260) only because
// the pack's configs say so.
// A run writes a missing config out with its defaults, so a real file here is one of those.
tasks.register('linkServerConfigs') {
    description = 'Links the dev runs\' server configs to the pack\'s.'
    def names = ['beltworks-server.toml', 'craftworks-server.toml',
                 'researchd-server.toml', 'wireworks-server.toml']
    doLast {
        names.each { name ->
            def link = file("run/config/${name}").toPath()
            def target = rootProject.file("config/${name}").toPath()
            java.nio.file.Files.deleteIfExists(link)
            java.nio.file.Files.createDirectories(link.parent)
            java.nio.file.Files.createSymbolicLink(link, link.parent.relativize(target))
        }
    }
}

tasks.matching { it.name.startsWith('prepare') && it.name.endsWith('Run') }.configureEach {
    dependsOn tasks.named('linkKubeJS'), tasks.named('linkServerConfigs')
}

// `neoforge.mods.toml` is the one place a version string has to be interpolated;
// everything else the mod knows lives in the pack's data, not in the jar.
def modMetadata = [
        mod_id              : mod_id,
        mod_name            : mod_name,
        mod_version         : mod_version,
        minecraft_version   : minecraft_version,
        loader_version_range: loader_version_range,
        // The pack ships one NeoForge build; the mod refuses to load on an older one.
        neoforge_version_range: "[${neoforge_version},)",
]

tasks.named('processResources', ProcessResources).configure {
    // A checkout's jar is built by this run, so no row's metadata is read before the task runs.
    def ranges = nestedArtifacts.collectEntries { artifact ->
        [("${artifact}_version_range".toString()): providers.provider { nestedRange(artifact) }]
    }
    inputs.files rowJars.values()
    inputs.properties modMetadata
    ranges.each { key, range -> inputs.property key, range }
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand modMetadata + ranges.collectEntries { key, range -> [key, "${-> range.get()}"] }
    }
}

// The jar is published on its own, so it carries the licence texts LGPL and CC BY require (ADR-0102).
tasks.named('jar', Jar) {
    from(rootDir) { include 'LICENSE', 'NOTICE', 'LICENSES/**' }
}

// scripts/release.sh publishes here before the upload (ADR-0101).
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = mod_id
            from components.java
        }
    }
}

// The pack loads jars from `mods/`, which is gitignored. Build straight into it so
// `./gradlew build` is the whole install step.
if (siblingBuilds) {
    tasks.register('installToPack') {
        doFirst {
            throw new GradleException('installToPack refuses under -PsiblingBuilds: this jar is built '
                    + "against the checkouts of ${siblingMods.join(', ')}, not the pinned jars in mods/")
        }
    }
} else {
    tasks.register('installToPack', Copy) {
        dependsOn tasks.named('jar')
        from tasks.named('jar')
        into rootProject.file('mods')
        // The jar's name carries mod_version, so a release leaves the old one behind and the game
        // then finds the mod twice; the Libraries' stale jars are sync-local-jars.py's to remove.
        def installed = tasks.named('jar').flatMap { it.archiveFileName }
        def stale = { fileTree(rootProject.file('mods')) { include "${mod_id}-*.jar"; exclude installed.get() } }
        outputs.upToDateWhen { stale().isEmpty() }
        doFirst { delete stale() }
    }
}
