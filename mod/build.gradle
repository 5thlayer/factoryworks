plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}

version = mod_version
group = maven_group
base.archivesName = mod_id

// Where `gameTestPack` assembles the datapack the GameTest run is handed. Declared up here
// because the run configuration below reads it.
def gameTestPacks = layout.buildDirectory.dir('gametest/packs')

// Minecraft 26.1.2 and every 26.1 mod jar in `mods/` are compiled to class file version 69,
// which is Java 25. Building on 21 cannot read them.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neoforge_version

    // No `parchment` block: ParchmentMC has published no mappings for 26.1 (the newest data is
    // `parchment-1.21.9`). Restore it -- and the two `parchment_*` keys in `gradle.properties` --
    // the day a 26.1 release exists; until then naming one fails the build rather than
    // silently falling back.

    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        gameTestServer {
            type = 'gameTestServer'
            // 26.1 dropped `neoforge.enabledGameTestNamespaces`; with no `--tests` selector the
            // server runs every registered test, which here is the mod's own plus vanilla's
            // `minecraft:always_pass`.
            //
            // The pack's datapack is not on this server's classpath -- the GameTest world is
            // vanilla plus the mod jar -- so the one thing a smelt test needs that the jar does
            // not carry is handed over as a datapack. See the `gameTestPack` task.
            programArgument '--packs'
            programArgument gameTestPacks.get().asFile.absolutePath
        }
    }

    mods {
        "$mod_id" {
            sourceSet sourceSets.main
        }
    }
}

configurations {
    devRunMods
    runtimeClasspath.extendsFrom devRunMods
}

// Compile-time jars are taken from `mods/` rather than from a maven, so the build stays offline and
// always compiles against exactly the jars the pack ships.
dependencies {
    // EMI and JEI are here for the recipe-viewer lock annotation (issue #75), and Jade for the
    // pole's live HUD line (#147). All three plugin classes are found by their own host's
    // annotation scan and referenced from nowhere else in the mod, so none of the jars is needed
    // at runtime for the rest of it to load.
    //
    // Jade's jar ships with a capital J, so the pattern carries both spellings rather than relying
    // on a case-insensitive filesystem to paper over it.
    //
    // GeckoLib because the Steam Engine mixin (#282) extends Oritech's machine base class, which
    // implements GeckoLib's `GeoBlockEntity`; javac needs the supertype to resolve the hierarchy.
    compileOnly fileTree(
            dir: rootProject.file('mods'),
            include: ['oritech-*.jar', 'researchd-*.jar', 'emi-*.jar', 'jei-*.jar',
                      'Jade-*.jar', 'jade-*.jar', 'geckolib-neoforge-*.jar'])
    // FTB Materials, and the library it requires, on every dev run's classpath -- the GameTest server
    // included. ADR-0061 gives the item layer to FTB Materials, so the pack's emitted smelts name
    // `ftbmaterials:` items, and a server that is only vanilla plus this jar rejects all three at
    // datapack load (`scripts/check-datapack-load.py`). This is the one foreign mod the harness
    // loads, and it is here because the pack's data names its items, not because the mod calls it.
    //
    // On `runtimeClasspath` only, through its own configuration: `runtimeOnly` would also land on
    // `test`'s classpath, making `mods/` an input of a task `installToPack` writes into.
    devRunMods fileTree(
            dir: rootProject.file('mods'),
            include: ['ftb-materials-*.jar', 'ftb-library-neoforge-*.jar'])
    // DataFixerUpper, and only DataFixerUpper. `Codec` is Mojang's serialisation library rather
    // than a Minecraft type, so the Assembler's attachment codec can be round-tripped on a plain
    // JVM -- which is what ADR-0038's "round-trip the data attachment" asks for. Minecraft itself
    // stays off this classpath; the version is the one Minecraft 1.21.1 ships.
    testImplementation 'com.mojang:datafixerupper:8.0.16'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

repositories {
    mavenCentral()
}

// The test source set is deliberately absent from `neoForge.mods` above, so Minecraft is not on its
// classpath. That is the pack's testing policy, not an oversight: the row for "this pack logic
// computes something" asks for an ordinary unit test run without Minecraft, and a classpath that
// cannot see a `ResourceLocation` is what keeps the logic honest about staying testable.

tasks.named('test', Test).configure {
    useJUnitPlatform()
    testLogging { events 'failed' }
}

// The datapack the GameTests run against (#271), and the one every emitted data file is loaded
// by (#273).
//
// A GameTest server loads vanilla's data plus what is in the mod jar, and the pack's data is
// neither: it is generated files under `kubejs/`, read by a KubeJS that is not installed here.
// Copying them into a datapack is what lets `planetaryfactory:smelting` be checked against the
// recipe the pack actually ships rather than against a fixture written to pass -- and what lets
// `scripts/check-datapack-load.py` watch the game read every one of them.
//
// The live subtrees only. `gtceu/`, `gt_materials/` and `gcyr/` name registries that left with
// ADR-0060: they would fail here for a reason #273 has already deferred to the chassis (#258), a
// permanently red check rather than a signal. Every recipe is loaded, subtrees included: #279
// re-targeted the converter onto `planetaryfactory:assembling`, and a recipe nothing loads is the
// failure #87 never got to see.

tasks.register('gameTestPack', Sync) {
    description = 'Assembles the datapack the GameTests run against, from the pack\'s own data.'
    into gameTestPacks.map { it.dir('planetaryfactory') }
    from(rootProject.file('kubejs/data/planetaryfactory/recipe')) {
        into 'data/planetaryfactory/recipe'
    }
    from(rootProject.file('kubejs/data/planetaryfactory/loot_table')) {
        into 'data/planetaryfactory/loot_table'
    }
    from(rootProject.file('kubejs/data/planetaryfactory/fuel')) {
        into 'data/planetaryfactory/fuel'
    }
    from(rootProject.file('kubejs/data/planetaryfactory/tags')) {
        into 'data/planetaryfactory/tags'
    }
    from(rootProject.file('kubejs/data/planetaryfactory/worldgen')) {
        into 'data/planetaryfactory/worldgen'
    }
    from(rootProject.file('kubejs/data/planetaryfactory/structure')) {
        into 'data/planetaryfactory/structure'
    }
    from(rootProject.file('kubejs/data/c/tags')) {
        into 'data/c/tags'
    }
    from(rootProject.file('kubejs/data/minecraft/tags')) {
        into 'data/minecraft/tags'
    }
    doLast {
        // 101 is 26.1's DATA_PACK_FORMAT_MAJOR. A pack declaring the wrong one still loads, but it
        // loads with a warning that reads exactly like a real incompatibility.
        new File(destinationDir, 'pack.mcmeta').text = """{
  "pack": {
    "pack_format": 101,
    "description": "Planetary Factory: the pack data the GameTests run against"
  }
}
"""
    }
}

tasks.matching { it.name in ['prepareGameTestServerRun', 'runGameTestServer'] }.configureEach {
    dependsOn tasks.named('gameTestPack')
}

// `neoforge.mods.toml` is the one place a version string has to be interpolated;
// everything else the mod knows lives in the pack's data, not in the jar.
def modMetadata = [
        mod_id              : mod_id,
        mod_name            : mod_name,
        mod_version         : mod_version,
        minecraft_version   : minecraft_version,
        loader_version_range: loader_version_range,
        // The pack ships one NeoForge build; the mod refuses to load on an older one.
        neoforge_version_range: "[${neoforge_version},)",
]

tasks.named('processResources', ProcessResources).configure {
    inputs.properties modMetadata
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand modMetadata
    }
}

// The pack loads jars from `mods/`, which is gitignored. Build straight into it so
// `./gradlew build` is the whole install step.
tasks.register('installToPack', Copy) {
    dependsOn tasks.named('jar')
    from tasks.named('jar')
    into rootProject.file('mods')
}
