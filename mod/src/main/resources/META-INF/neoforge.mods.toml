modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "LGPL-3.0-only"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
description = '''
The FactoryWorks modpack's first-party mod. It owns the mechanisms no scripting
API in the pack exposes -- currently the saplings of Sapros's two trees and their
TreeGrower -- and no tunable content whatsoever. See ADR-0014 and ADR-0015.
'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version},)"
ordering = "NONE"
side = "BOTH"

# Researchd is not here at all, because the 26.1.2 port removed every class that touched it -- see
# `docs/port/blocked-removals-26.1.2.md`.
#
# Oritech is **required** (ADR-0071). It was optional while nothing but `mixin/oritech/` and one
# GameTest class named it, and every Oritech mixin is still `required: false` for the reason it
# always was: a renamed target is a warning and an uncalibrated engine. The Assembling Machine
# (#326) is a *subclass* of `MultiblockMachineEntity`, which has no such escape hatch -- without
# Oritech its block entity class cannot load at all -- so the dependency is stated rather than
# discovered as a crash. The version is pinned to the one the subclass was read against, the way
# KubeJS's is: 2.0.0-exp6 is an experimental build, and a bump is re-checked, not assumed.
#
# The earlier `required` blocks named GTCEu's version line, `[7.0.2,)`, which Oritech's
# `2.0.0-exp6` sorts *below* -- a requirement the shipped jar could never meet. That is why the
# range here names Oritech's own version exactly.
#
# `AFTER` is kept: the machines are built on top of Oritech's classes.
[[dependencies.${mod_id}]]
modId = "oritech"
type = "required"
versionRange = "[2.0.0-exp6]"
ordering = "AFTER"
side = "BOTH"

# The range is read from the Beltworks jar that nests it, so the two resolve to one loaded version
# (ADR-0024).
[[dependencies.${mod_id}]]
modId = "groundworks"
type = "required"
versionRange = "${groundworks_version_range}"
ordering = "NONE"
side = "BOTH"

[[mixins]]
config = "factoryworks_core.mixins.json"

# Not required for the same reason: it targets Oritech, an optional dependency. The Steam Engine's
# calibration to Factorio (#282, ADR-0062).
[[mixins]]
config = "factoryworks_core.oritech.mixins.json"

# Both recipe viewers ship with the pack and both were listing a research-locked recipe exactly
# like an unlocked one (issue #75). Neither is required for the mod to load. JEI is driven by a
# plugin its own annotation scan discovers; EMI needs a mixin, because the equivalent EMI seam is
# gated behind a developer-facing config flag that is off for players -- see RecipeDisplayMixin.
[[dependencies.${mod_id}]]
modId = "emi"
type = "optional"
ordering = "AFTER"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "jei"
type = "optional"
ordering = "AFTER"
side = "CLIENT"

# Pinned because the Radar's map drawing calls FTB Chunks' internals, not its API (ADR-0079).
[[dependencies.${mod_id}]]
modId = "ftbchunks"
type = "optional"
versionRange = "[26.1.2.8]"
ordering = "NONE"
side = "CLIENT"
