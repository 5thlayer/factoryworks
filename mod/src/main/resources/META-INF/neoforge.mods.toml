modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "MIT"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
description = '''
The Planetary Factory modpack's first-party mod. It owns the mechanisms no scripting
API in the pack exposes -- currently the saplings of Sapros's two trees and their
TreeGrower -- and no tunable content whatsoever. See ADR-0014 and ADR-0015.
'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version},)"
ordering = "NONE"
side = "BOTH"

# Optional, and Researchd is not here at all, because the 26.1.2 port removed every class that
# touched either mod -- see `docs/port/blocked-removals-26.1.2.md`. Nothing in this jar imports
# `rearth.oritech`, and the two mixins that named GregTech classes went with their targets.
#
# These two blocks were `required` and were a load failure rather than a build one, which is the
# failure mode a green compile cannot see. The range was worse than the type: `[7.0.2,)` is
# GTCEu's version line, and Oritech's `2.0.0-exp6` sorts *below* it, so the requirement could
# never have been met by the jar the pack actually ships.
#
# `AFTER` is kept: #262 adds the machine chassis on top of Oritech, and load order is cheap to
# state now and easy to forget then.
[[dependencies.${mod_id}]]
modId = "oritech"
type = "optional"
versionRange = "[2.0.0-exp6,)"
ordering = "AFTER"
side = "BOTH"

[[mixins]]
config = "planetaryfactory_core.mixins.json"

# Separate, and not required, because it targets EMI -- an optional client-side dependency. A
# missing target class in the main config would be fatal; here it is skipped.
[[mixins]]
config = "planetaryfactory_core.emi.mixins.json"

# Both recipe viewers ship with the pack and both were listing a research-locked recipe exactly
# like an unlocked one (issue #75). Neither is required for the mod to load. JEI is driven by a
# plugin its own annotation scan discovers; EMI needs a mixin, because the equivalent EMI seam is
# gated behind a developer-facing config flag that is off for players -- see RecipeDisplayMixin.
[[dependencies.${mod_id}]]
modId = "emi"
type = "optional"
ordering = "AFTER"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "jei"
type = "optional"
ordering = "AFTER"
side = "CLIENT"

[[accessTransformers]]
file = "META-INF/accesstransformer.cfg"
