name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # The skill diffs against the base's merge-base and reads the PR's commit messages, and
          # .claude/skills links into the mattpocock/skills submodule.
          fetch-depth: 0
          submodules: true

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review pull request ${{ github.repository }}#${{ github.event.pull_request.number }} with the
            repo's `code-review` skill, `.claude/skills/code-review/SKILL.md`. Do not use the built-in
            /code-review that shares its name.

            Nobody is watching this run, so never stop to ask:
            - The fixed point is `origin/${{ github.event.pull_request.base.ref }}`.
            - Look for the spec in the PR's own body (`gh pr view ${{ github.event.pull_request.number }}`)
              as well as in the commit messages. If none is found, skip the Spec axis and say so.

            Post the skill's final report, the `## Standards` and `## Spec` sections and the summary
            line, as one comment with `gh pr comment ${{ github.event.pull_request.number }}`.
          claude_args: >-
            --allowedTools "Skill,Agent,Task,Read,Glob,Grep,Bash(git diff:*),Bash(git log:*),Bash(git rev-parse:*),Bash(gh issue view:*),Bash(gh pr view:*),Bash(gh pr comment:*)"
