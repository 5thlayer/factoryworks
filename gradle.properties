org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Matches the pack: Minecraft 26.1.2 on NeoForge 26.1.2.x. Parchment has no 26.1 release, so
# `mod/build.gradle` declares no `parchment` block and no `parchment_*` key lives here.
minecraft_version=26.1.2
neoforge_version=26.1.2.109
loader_version_range=[4,)

mod_id=factoryworks_core
mod_name=FactoryWorks Core
mod_version=0.1.1
maven_group=com.factoryworks
